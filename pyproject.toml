[project]
name = "charge-injection-sim"
version = "0.1.0"
description = "Numerical simulation of charge-injection-driven conductivity in dielectric materials"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "pydantic>=2,<3",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "prek",
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "ruff",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--disable-socket",
    "--allow-unix-socket",
]
filterwarnings = ["error"]
markers = [
    "regression: numerical comparison against a recorded reference result",
    "slow: simulation test excluded from the fast test suite when requested",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["charge_injection_sim"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "NPY", "PERF", "RUF", "SIM", "UP"]

[tool.ruff.format]
line-ending = "lf"
